<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome Page</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f7fb;
      font-family: Arial, sans-serif;
    }

    .welcome {
      text-align: center;
      padding: 40px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    h1 { color: #2563eb; }
    p { color: #555; }
  </style>
</head>
<body>
  <div class="welcome">
    <h1>Welcome to My Website!</h1>
    <p>Hello World! My first HTML page is ready.</p>
    <p>Built with HTML and CSS.</p>
  </div>
</body>
</html>
